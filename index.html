<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão da Rifa Especial - E.M. Therezinha Pedrosa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rifa Especial - Cesta de Chocolates</h1>
    <p>E. M. THEREZINHA PEDROSA</p>
  </header>

  <main class="container">
    <!-- Indicador de status de sincronização -->
    <div id="status-rede">Sincronizando...</div>

    <!-- Métricas Rápidas -->
    <section class="stats">
      <div class="card-stat">
        <span class="label">Total Vendido</span>
        <span class="val" id="stat-arrecadado">R$ 0,00</span>
      </div>
      <div class="card-stat">
        <span class="label">Números Pagos</span>
        <span class="val" id="stat-vendidos">0 / 1500</span>
      </div>
    </section>

    <!-- Abas de Navegação -->
    <nav class="tabs">
      <button class="tab-btn active" onclick="mudarAba('baixa')">Dar Baixa nos Números</button>
      <button class="tab-btn" onclick="mudarAba('sorteio')">Módulo de Sorteio</button>
    </nav>

    <!-- ABA 1: DAR BAIXA -->
    <section id="aba-baixa" class="aba-conteudo active">
      <!-- Formulário de Entrada -->
      <div class="painel-input">
        <form id="form-adicionar" onsubmit="adicionarNumero(event)">
          <input type="number" id="input-numero" placeholder="Digite o número (1-1500)" min="1" max="1500" required autofocus>
          <button type="submit" class="btn-principal">Adicionar Número</button>
        </form>
      </div>

      <!-- Campo de Busca -->
      <div class="painel-busca">
        <input type="text" id="input-busca" placeholder="🔍 Buscar número cadastrado..." oninput="filtrarNumeros()">
      </div>

      <!-- Lista de Números Vendidos -->
      <div class="lista-header">
        <h3>Números Cadastrados (Ordem Crescente)</h3>
      </div>
      <div id="container-numeros" class="grid-tags"></div>
    </section>

    <!-- ABA 2: SORTEIO -->
    <section id="aba-sorteio" class="aba-conteudo">
      <h2>Sorteio dos Números Vendidos</h2>
      <p>Apenas números com baixa confirmada participarão do sorteio.</p>
      
      <div class="sorteio-box">
        <div id="visor-numero" class="visor">?</div>
        <button id="btn-sortear" onclick="realizarSorteio()" class="btn-destaque">🎉 Realizar Sorteio</button>
      </div>
      <div id="resultado-sorteio" class="resultado-box"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
